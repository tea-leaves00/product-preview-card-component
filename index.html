<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
    <title>Frontend Mentor | Product preview card component</title>
  </head>
  <body>
    <main>
      <div class="card">
        <picture>
          <source media="(min-width: 450px)" srcset="images/image-product-desktop.jpg">
          <img class="card__product-image" src="images/image-product-mobile.jpg" alt="Gabrielle Chanel Perfume Bottle">
        </picture>

        <div class="card__content">
          <p class="card__category">PERFUME</p>
          <h1 class="card__title">Gabrielle Essence Eau De Parfum</h1>
          <p class="card__description">A floral, solar and voluptuous interpretation composed by Olivier Polge, 
          Perfumer-Creator for the House of CHANEL.</p>
        
          <span class="card__prices">
            <data class="card__current-price" value="149.99">$149.99</data>
            <s class="card__old-price">$169.99</s>
          </span>

          <button class="card__button" type="button">
            <img src="images/icon-cart.svg" alt="">
            Add to Cart
          </button>
        </div>
      </div>
    </main>
  </body>
</html>
